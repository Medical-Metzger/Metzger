
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coronary✦Axis</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <nav class="site-nav" aria-label="Portfolio navigation">
    <a href="index.html">HOME</a>
    <a href="medical-art.html" class="active">MEDICAL ART</a>
    <a href="3d-works.html">3D WORKS</a>
    <a href="graphic-design.html">GRAPHIC DESIGN</a>
    <a href="illustration.html">ILLUSTRATION</a>
    <a href="games.html">SIMULATIONS</a>
    <a href="about-me.html">ABOUT ME</a>
    <a href="project.html">PROJECT</a>
  </nav>

  <main>

    <!-- Page heading -->
    <section class="hero compact">
      <p class="eyebrow">
        <a href="index.html">Home</a> //
        <a href="medical-art.html">Medical Art</a> //
        Axis Comparison
      </p>

      <h2>A Diagrammatic Visualisation of Heart Anatomy</h2>

      <p class="lead">
        Illustrating single photon emission computed tomography (SPECT) output.
      </p>
    </section>

    <!-- First row: three images -->
    <section class="axis-image-row" aria-label="Medical image gallery, first row">

      <img
        src="medical%20illustration/axis/short_display.PNG"
        alt="Short axis display"
        data-title="Short Axis Display"
        data-description="A displayed short-axis view of the anatomical data."
        loading="lazy"
      >

      <img
        src="medical%20illustration/axis/horizontal_display.PNG"
        alt="Horizontal axis display"
        data-title="Horizontal Axis Display"
        data-description="A displayed horizontal-axis view of the anatomical data."
        loading="lazy"
      >

      <img
        src="medical%20illustration/axis/vertical_display.PNG"
        alt="Vertical axis display"
        data-title="Vertical Axis Display"
        data-description="A displayed vertical-axis view of the anatomical data."
        loading="lazy"
      >

    </section>

    <!-- Video -->
    <div class="video-container">
      <iframe
        src="https://www.youtube.com/embed/0bQHmoke9hw"
        title="Improving patient attitudes towards MPI SPECT with Multimedia in the NHS"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Second row: three images -->
    <section class="axis-image-row" aria-label="Medical image gallery, second row">

      <img
        src="medical%20illustration/axis/verticalaxisoutput.PNG"
        alt="Vertical axis visualisation of heart anatomy"
        data-title="Vertical Axis"
        data-description="A visualisation of heart anatomy using SPECT imaging data."
        loading="lazy"
      >

      <img
        src="medical%20illustration/axis/shortaxisoutput.png"
        alt="Short axis visualisation of heart anatomy"
        data-title="Short Axis"
        data-description="A short-axis view of the anatomical data."
        loading="lazy"
      >

      <img
        src="medical%20illustration/axis/horizontalaxisoutput.PNG"
        alt="Horizontal axis visualisation of heart anatomy"
        data-title="Horizontal Axis"
        data-description="A horizontal-axis view of the anatomical data."
        loading="lazy"
      >

    </section>

    <!-- Image lightbox -->
    <div
      id="image-lightbox"
      class="image-lightbox"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Image details"
    >

      <!-- Close button -->
      <button
        type="button"
        class="lightbox-close"
        aria-label="Close image">
        &times;
      </button>

      <!-- Previous image button -->
      <button
        type="button"
        class="lightbox-arrow lightbox-prev"
        aria-label="Previous image">
        &#10094;
      </button>

      <!-- Next image button -->
      <button
        type="button"
        class="lightbox-arrow lightbox-next"
        aria-label="Next image">
        &#10095;
      </button>

      <!-- Enlarged image and description -->
      <div class="lightbox-content">
        <img id="lightbox-image" src="" alt="">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-description"></p>
      </div>

    </div>

  </main>

  <!-- Gallery JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const lightbox = document.getElementById("image-lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const lightboxTitle = document.getElementById("lightbox-title");
      const lightboxDescription = document.getElementById("lightbox-description");
      const closeButton = document.querySelector(".lightbox-close");
      const previousButton = document.querySelector(".lightbox-prev");
      const nextButton = document.querySelector(".lightbox-next");

      const galleryImages = Array.from(
        document.querySelectorAll(".axis-image-row img")
      );

      let currentIndex = 0;
      let previousFocus = null;

      // Display a selected image and its description
      function showImage(index) {
        currentIndex =
          (index + galleryImages.length) % galleryImages.length;

        const img = galleryImages[currentIndex];

        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;

        lightboxTitle.textContent =
          img.dataset.title || img.alt;

        lightboxDescription.textContent =
          img.dataset.description || "";

        lightbox.setAttribute(
          "aria-label",
          (img.dataset.title || img.alt) +
          ", image " + (currentIndex + 1) +
          " of " + galleryImages.length
        );
      }

      // Open the image gallery
      function openLightbox(index) {
        previousFocus = document.activeElement;

        showImage(index);

        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");

        document.body.style.overflow = "hidden";

        closeButton.focus();
      }

      // Close the image gallery
      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");

        lightboxImage.src = "";
        document.body.style.overflow = "";

        if (previousFocus) {
          previousFocus.focus();
        }
      }

      // Make every gallery image clickable and keyboard accessible
      galleryImages.forEach(function (img, index) {

        img.style.cursor = "pointer";
        img.setAttribute("tabindex", "0");
        img.setAttribute("role", "button");

        img.setAttribute(
          "aria-label",
          "View " + (img.dataset.title || img.alt)
        );

        img.addEventListener("click", function () {
          openLightbox(index);
        });

        img.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openLightbox(index);
          }
        });

      });

      // Close button
      closeButton.addEventListener("click", closeLightbox);

      // Previous and next buttons
      previousButton.addEventListener("click", function () {
        showImage(currentIndex - 1);
      });

      nextButton.addEventListener("click", function () {
        showImage(currentIndex + 1);
      });

      // Close when clicking the dark background
      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      // Keyboard controls while the gallery is open
      document.addEventListener("keydown", function (event) {

        if (!lightbox.classList.contains("open")) {
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          showImage(currentIndex + 1);
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          showImage(currentIndex - 1);
        }

        if (event.key === "Escape") {
          closeLightbox();
        }

      });

    });
  </script>

</body>
</html>
