.project-card p,.text-section p{font-size:20px;line-height:1.35}
.image-placeholder{height:330px;background:#d9d9d9;display:flex;align-items:center;justify-content:center;color:#666;font-family:Arial,sans-serif}
.text-section{max-width:760px;padding:40px 0}
.back{margin-top:40px}
.back a{font-size:18px}
@media(max-width:760px){
  .site-nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding:12px}

  main{width:min(100% - 24px,1120px);padding:48px 0 80px}
